<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Som de teste</title><style>body{font:20px -apple-system,sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#eee}button{font-size:28px;padding:24px 40px;border-radius:20px}</style></head>
<body><button id="b" aria-label="Tocar som">Tocar som</button><p id="s"></p>
<script>
// Página de laboratório: toca 4 s de um tom para interromper o áudio de outro app (como uma notificação ou vídeo).
document.getElementById('b').onclick = function () {
  var n = 8000 * 4, buf = new ArrayBuffer(44 + n), v = new DataView(buf), t = function (o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)) }
  t(0, 'RIFF'); v.setUint32(4, 36 + n, true); t(8, 'WAVE'); t(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true)
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); t(36, 'data'); v.setUint32(40, n, true)
  for (var i = 0; i < n; i++) v.setUint8(44 + i, 128 + Math.round(60 * Math.sin(2 * Math.PI * 440 * i / 8000)))
  var a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }))); a.play().then(function () { document.getElementById('s').textContent = 'tocando' })
}
</script></body></html>
