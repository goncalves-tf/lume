<!doctype html><html lang="pt-BR" style="background:#1b1a18"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="V2">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="/lume/apple-touch-icon.png">
<title>V2</title>
<style>html,body{margin:0;height:100%;background:#1b1a18;overflow:hidden}#app{position:fixed;inset:0;background:#1b1a18;color:#e33}
#borda{position:fixed;inset:0;border:5px solid #f0f;box-sizing:border-box;pointer-events:none;z-index:9}
#seg{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);border:3px dashed #0c0;box-sizing:border-box;pointer-events:none;z-index:8}
pre{position:absolute;top:40%;left:12px;right:12px;font:15px/1.4 ui-monospace,monospace;color:#f60;background:#0008;padding:8px;white-space:pre-wrap}</style></head>
<body><div id="app"><pre id="d"></pre></div><div id="borda"></div><div id="seg"></div>
<script>function env(l){var e=document.createElement('div');e.style.cssText='position:fixed;visibility:hidden;height:env(safe-area-inset-'+l+',0px)';document.body.appendChild(e);var h=e.offsetHeight;e.remove();return h}
function draw(){document.getElementById('d').textContent='V2: padrao sem theme-color
standalone '+navigator.standalone+' | dm '+matchMedia('(display-mode: standalone)').matches+'
screen '+screen.width+'x'+screen.height+'
inner '+innerWidth+'x'+innerHeight+' | clientH '+document.documentElement.clientHeight+'
safe T'+env('top')+' B'+env('bottom')+' L'+env('left')+' R'+env('right')+'
'+(navigator.userAgent.match(/OS [\d_]+/)||[''])[0]+'
'+'<span id=cor></span>'}
draw();addEventListener('resize',draw);setTimeout(draw,1500)</script><span id="cor" style="position:fixed;top:30%;left:12px;color:#ff0;font:bold 20px sans-serif"></span></body></html>
